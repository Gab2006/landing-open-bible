<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Google Fonts: Inter and Crimson Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <title>OpenBible - La Parola, senza distrazioni</title>
    
    <!-- Meta Tags per SEO e Social Sharing -->
    <meta name="description" content="OpenBible è un lettore biblico essenziale, elegante e completamente offline. Progettato per offrire un'esperienza di lettura pura e immersiva." />
    <meta name="keywords" content="bibbia, offline, lettura, meditazione, app biblica, vangelo, openbible" />
    <meta name="author" content="Gabriele Tosti" />
    <meta name="theme-color" content="#FAF6EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1917" media="(prefers-color-scheme: dark)" />
    
    <!-- Open Graph (Facebook, LinkedIn, ecc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OpenBible - La Parola, senza distrazioni" />
    <meta property="og:description" content="OpenBible è un lettore biblico essenziale, elegante e completamente offline." />
    <meta property="og:image" content="/nobg-icon.png" />
    <meta property="og:url" content="https://openbible.example.com/" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="OpenBible - La Parola, senza distrazioni" />
    <meta name="twitter:description" content="OpenBible è un lettore biblico essenziale, elegante e completamente offline." />
    <meta name="twitter:image" content="/nobg-icon.png" />
  </head>
  <body>
    <div id="root">
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #FAF6EF;" id="initial-loader">
        <img src="/nobg-icon.png" alt="Caricamento..." style="width: 80px; height: 80px; animation: spin-slow 3s linear infinite;" />
        <style>
          @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
          @media (prefers-color-scheme: dark) {
            #initial-loader {
              background-color: #1A1917 !important;
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
